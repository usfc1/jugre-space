  #viewport{container-type:inline-size}

  .broadcast-bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:5px}
  .broadcast-clock{text-align:center;min-width:clamp(215px,32cqw,600px)}
  .broadcast-clock>output{display:block;font-size:clamp(27px,3.7cqw,66px);font-weight:300;line-height:1.1;letter-spacing:.035em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .broadcast-state{height:15px;font-size:clamp(8px,.65cqw,11px);font-weight:500;letter-spacing:.24em;line-height:15px}

  .broadcast-metric>div{font-size:clamp(21px,2.4cqw,42px);line-height:1.35;font-variant-numeric:tabular-nums;white-space:nowrap}
  .broadcast-metric small{font-size:clamp(8px,.7cqw,12px);font-weight:400;letter-spacing:.03em}

  #viewport:has(#broadcast-hud:not([hidden])) #flight-banner{font-size:clamp(12px,1.2cqw,19px);font-weight:400;color:#fff;max-width:70%}
  .timeline-controls{display:flex;gap:5px;align-items:center}
  .timeline-controls button{padding:5px 8px;font-size:11px}
  #timeline-zoom{background:#14232d;color:inherit;border:1px solid #466573;min-width:0;padding:4px;font:inherit;font-size:11px;flex:1}
  #timeline-details{white-space:pre-line;color:#afc0ca;font-size:10px;line-height:1.6;min-height:64px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
  @container(max-width:650px){#broadcast-hud{--hud-height:146px;padding-inline:12px}.broadcast-marker{width:65px}.broadcast-label{max-width:75px;white-space:normal;line-height:1.15;top:3px}.broadcast-metric>div{font-size:18px}.broadcast-clock{min-width:190px}.broadcast-clock>output{font-size:25px}.broadcast-footnote{letter-spacing:.04em}.broadcast-mission{letter-spacing:.15em}}
